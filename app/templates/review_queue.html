<section class="panel review-queue"><div class="panel-head"><h2>工单异常</h2><span>{{data.quarantine|length}} 条</span></div><div class="scroll"><table><thead><tr><th>来源行</th><th>工单ID</th><th>原因码</th></tr></thead><tbody>{% for q in data.quarantine %}<tr><td class="number">{{q.line}}</td><td>{{q.id}}</td><td><span class="reject" title="{{q.raw}}">{{q.code}}</span></td></tr>{% else %}<tr><td colspan="3">暂无异常工单</td></tr>{% endfor %}</tbody></table></div></section>
