{% extends "base.html" %}{% block content %}<div class="press-grid"><section class="panel dominant"><div class="panel-head"><h2>生产工单</h2><span>{{data.encoding}}</span></div><div class="scroll"><table><thead><tr><th>订单</th><th>纸批</th><th>纸张 mm</th><th>成品 mm</th><th>印量</th><th>交期</th></tr></thead><tbody>{% for r in data.rows %}<tr><td>{{r.order_id}}</td><td>{{r.lot}}</td><td class="number">{{r.paper_w}} × {{r.paper_h}}</td><td class="number">{{r.piece_w}} × {{r.piece_h}}</td><td class="number">{{r.quantity}}</td><td>{{r.due}}</td></tr>{% endfor %}</tbody></table></div></section><section class="panel side"><div class="panel-head"><h2>载入工单</h2></div><form id="job-input"><label>样例<select name="sample"><option>dirty.csv</option><option>clean.csv</option><option>legacy.csv</option></select></label><label>原始CSV<textarea name="csv" rows="5" placeholder="粘贴生产工单"></textarea></label><button class="solid">排算</button></form></section>{% include "review_queue.html" %}</div>{% endblock %}
